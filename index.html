<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Finance - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL: Estructura general que divide la pantalla en dos columnas -->
    <div class="login-container">

        <!-- ==========================================
             SECCIÓN 1: PANEL IZQUIERDO (Ilustración / Branding)
             Diseñado para estilos de fondo azul y texto de bienvenida de la marca.
             ========================================== -->
        <div class="brand-panel">
            
            <!-- Cabecera de la marca (Logotipo e isotipo) -->
            <div class="brand-header">
                <div class="brand-logo-icon"></div> <!-- Icono del círculo superior izquierdo -->
                <span class="brand-name">Eagle</span>
            </div>

            <!-- Contenido textual central del panel izquierdo -->
            <div class="brand-content">
                <h1 class="brand-title">Start Your Journey With Us.</h1>
                <p class="brand-description">
                    Our comprehensive suite of financial services is meticulously designed to cater to your specific needs.
                </p>
            </div>

            <!-- Contenedor decorativo inferior (líneas circulares de fondo) -->
            <div class="brand-decoration"></div>
        </div>


        <!-- ==========================================
             SECCIÓN 2: PANEL DERECHO (Formulario de Acceso)
             Contiene los campos de entrada, validaciones y enlaces de autenticación.
             ========================================== -->
        <div class="form-panel">
            
            <!-- Encabezado del formulario -->
            <div class="form-header">
                <h2 class="form-title">Log in into Your Account</h2>
                <p class="form-subtitle">Welcome back!</p>
            </div>

            <!-- Formulario principal de inicio de sesión -->
            <!-- ID preparado para manipular el evento submit mediante JavaScript -->
            <form id="login-form" class="login-form" action="#" method="POST">
                
                <!-- Grupo de campo: Correo Electrónico (Email) -->
                <div class="input-group">
                    <label for="email" class="input-label">Email</label>
                    <div class="input-wrapper">
                        <!-- Icono decorativo de correo (puede manejarse con CSS o SVG) -->
                        <span class="input-icon email-icon">✉</span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Email" 
                            required 
                            class="form-input">
                    </div>
                </div>

                <!-- Grupo de campo: Contraseña (Password) -->
                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <div class="input-wrapper">
                        <!-- Icono de candado -->
                        <span class="input-icon lock-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••" 
                            required 
                            class="form-input">
                        <!-- Icono de mostrar/ocultar contraseña (Preparado para interactividad con JavaScript) -->
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar contraseña">👁</button>
                    </div>
                </div>

                <!-- Opciones adicionales: Recordarme y Olvidé mi contraseña -->
                <div class="form-actions-row">
                    <div class="checkbox-container">
                        <input type="checkbox" id="remember-me" name="remember" class="form-checkbox">
                        <label for="remember-me" class="checkbox-label">Remember Me</label>
                    </div>
                    <!-- Enlace para recuperación de contraseña -->
                    <a href="#forgot-password" id="forgot-link" class="forgot-password-link">Forgot Password</a>
                </div>

                <!-- Botón principal de envío -->
                <button type="submit" class="submit-btn">Log in</button>
            </form>

            <!-- Pie de formulario: Registro para nuevos usuarios -->
            <div class="form-footer">
                <p class="signup-prompt">
                    Don't have an Account yet? 
                    <!-- Enlace hacia la vista de registro -->
                    <a href="#signup" id="signup-link" class="signup-link">Sign Up</a>
                </p>
            </div>

        </div>

    </div>

    <!-- Enlace preparado para el archivo de lógica JavaScript externo -->
    <script src="javascript/intex.js"></script>
</body>
</html>
