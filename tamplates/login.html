<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrediManager - Inicio de Sesión</title>

    <!-- Enlace al archivo CSS (Sube un nivel para entrar a la carpeta 'css') -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL: Agrupa toda la tarjeta del sistema -->
    <div class="contenedor-principal">

        <!-- ==========================================================
             SECCIÓN IZQUIERDA: Panel Informativo con Fondo Animado
             ========================================================== -->
        <section class="panel-informativo">
            
            <!-- Capas decorativas para el fondo animado de ondas (CSS) -->
            <div class="fondo-animado-ondas">
                <div class="onda onda-1"></div>
                <div class="onda onda-2"></div>
                <div class="onda onda-3"></div>
            </div>

            <!-- Contenido que flota sobre las ondas en movimiento -->
            <div class="contenido-flotante">
                
                <!-- Encabezado con el logotipo y título de la empresa -->
                <header class="encabezado-logo">
                    <div class="icono-logo-animado">🛡️</div>
                    <h1>CrediManager</h1>
                </header>

                <!-- Lema principal e información central -->
                <div class="texto-central-animacion">
                    <h2>Soluciones de Crédito Corporativo</h2>
                    <p>Plataforma de gestión financiera inteligente, segura y en tiempo real.</p>
                </div>

                <!-- Lista de ventajas del sistema -->
                <ul class="lista-caracteristicas">
                    <li>
                        <span class="icono">🔒</span>
                        <span>Seguridad y Confidencialidad Avanzada</span>
                    </li>
                    <li>
                        <span class="icono">📈</span>
                        <span>Análisis de Riesgo Automatizado</span>
                    </li>
                    <li>
                        <span class="icono">📋</span>
                        <span>Cumplimiento Normativo Integrado</span>
                    </li>
                </ul>

            </div>

        </section>


        <!-- ==========================================================
             SECCIÓN DERECHA: Punto de montaje para React
             ========================================================== -->
        <section id="raiz-formulario-react" class="panel-formulario">
            <!-- 
                Este contenedor está identificado con id="raiz-formulario-react".
                Tu archivo 'main.jsx' buscará este ID e inyectará aquí 
                todo el formulario interactivo construido con React (login2.jsx).
            -->
        </section>

    </div>

    <!-- 
        Carga del script principal de React.
        Usa type="module" porque utilizas sintaxis de módulos de JS (import/export).
        Sube un nivel con '../' para acceder a tu carpeta 'javascrip'.
    -->
    <script type="module" src="../javascrip/main.jsx"></script>

</body>
</html>
